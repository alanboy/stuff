set-window-option -g mode-keys vi

# so that you can copy to the clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# so that you can paste images
set -g allow-passthrough on

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#bind-key -n C-Left previous-window
#bind-key -n C-Right next-window

bind-key -n F2 previous-window
bind-key -n F3 next-window
bind-key -n F4 new-window

bind-key -n S-left previous-window
bind-key -n S-right next-window

# tmux may also be waiting for escape characters. As per this answer on 
# StackExchange, this can be solved by adding the following to .tmux.conf
set -s escape-time 0

# Disable the "repeat window" so the key immediately after prefix+<arrow> is
# treated as regular input, not another pane switch.
set -g repeat-time 0

# Thicker pane borders (tmux 3.2+)
set -g pane-border-lines double

# Dim inactive pane borders, bright orange for the active one
set -g pane-border-style        'fg=colour240'
set -g pane-active-border-style 'fg=colour208,bold'

# Tint inactive panes darker so the active pane visibly "lights up"
set -g window-style        'bg=colour235'
set -g window-active-style 'bg=colour232'

bind-key -n F5 source ~/.tmux.conf
# bind-key -n F6 detach
# bind-key -n F7 copy-mode
# bind-key -n M-NPage copy-mode \; send-keys NPage
# bind-key -n M-PPage copy-mode -u
# bind-key -n F8 command-prompt -p "(rename-window)" "rename-window %%"
# bind-key -n F9 new-window -a byobu-config

set -g status-justify centre

# # Must set default-command to $SHELL, in order to not source ~/.profile
# # BUG: Should *not* hardcode /bin/bash here
# set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# set-option -g default-shell /usr/bin/fish
set -g default-terminal "screen-256color"
set -g status-bg blue
set -g status-fg white
set -g status-interval 1
set -g status-left-length 80
set -g status-left '#{?pane_in_mode,#[fg=black#,bg=yellow#,bold] ▲ SCROLL (q to exit) ▲ #[default] ,#[fg=white#,bold] #{s|/Users/alan|~|:#{pane_current_path}} }'
set -g status-right '#[fg=white,bold,bg=magenta] %m/%d %I:%M:%S %p '

# Loud style for the [n/N] scroll counter + selection highlight
set -g mode-style 'fg=black,bg=yellow,bold'

# Window list: inactive = dim on blue, active = magenta button
set -g window-status-format         ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-style          'fg=colour250,bg=colour24'
set -g window-status-current-style  'fg=white,bold,bg=magenta'


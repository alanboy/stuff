set-window-option -g mode-keys vi

# so that you can copy to the clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# so that you can paste images
set -g allow-passthrough on

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#bind-key -n C-Left previous-window
#bind-key -n C-Right next-window

bind-key -n F2 previous-window
bind-key -n F3 next-window
bind-key -n F4 new-window

bind-key -n S-left previous-window
bind-key -n S-right next-window

# tmux may also be waiting for escape characters. As per this answer on 
# StackExchange, this can be solved by adding the following to .tmux.conf
set -s escape-time 0

# Disable the "repeat window" so the key immediately after prefix+<arrow> is
# treated as regular input, not another pane switch.
set -g repeat-time 0

# Dim inactive pane borders, soft pink for the active one
set -g pane-border-style        'fg=colour240'
set -g pane-active-border-style 'fg=colour214,bold'

# Show a small label at the top of each pane's border with the pane's current
# command (or its explicit title, if set with `printf '\033]2;name\033\\'` /
# `select-pane -T name`). Active pane's label picks up the pink border color.
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=colour214#,bold],#[fg=colour244]}#{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}} '

# Tint inactive panes darker so the active pane visibly "lights up"
set -g window-style        'bg=colour235'
set -g window-active-style 'bg=colour232'

bind-key -n F5 source ~/.tmux.conf
# bind-key -n F6 detach
# bind-key -n F7 copy-mode
# bind-key -n M-NPage copy-mode \; send-keys NPage
# bind-key -n M-PPage copy-mode -u
# bind-key -n F8 command-prompt -p "(rename-window)" "rename-window %%"
# bind-key -n F9 new-window -a byobu-config

set -g status-justify centre

# # Must set default-command to $SHELL, in order to not source ~/.profile
# # BUG: Should *not* hardcode /bin/bash here
# set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# set-option -g default-shell /usr/bin/fish
set -g default-terminal "screen-256color"
set -g status-bg blue
set -g status-fg white
set -g status-interval 1
set -g status-left-length 80
set -g status-left '#{?pane_in_mode,#[fg=black#,bg=yellow#,bold] ▲ SCROLL (q to exit) ▲ #[default] ,}'
set -g status-right ''

# Loud style for the [n/N] scroll counter + selection highlight
set -g mode-style 'fg=black,bg=yellow,bold'

# Flag non-focused windows when something happens in them
set -g monitor-activity on
set -g visual-activity  off    # don't spam a status-line message; the flag is enough
# set -g monitor-silence 60    # optional: also flag windows that go silent for 60s

# Window list: inactive = dim on blue, active = magenta button.
# Icons show what changed since last visit: ● activity, ⚠ bell, Z zoomed.
set -g window-status-format         ' #I:#W #{?window_bell_flag,#[fg=red#,bold]⚠#[default#,fg=colour250#,bg=colour24],#{?window_activity_flag,#[fg=colour214#,bold]●#[default#,fg=colour250#,bg=colour24],○}} '
set -g window-status-current-format ' #I:#W #{?window_zoomed_flag,Z,○} '
set -g window-status-style          'fg=colour250,bg=colour24'
set -g window-status-current-style  'fg=black,bold,bg=colour214'

# Activity: keep the exact same pill as inactive — the ○ → ● swap in the
# format string is the only signal.
set -g window-status-activity-style 'fg=colour250,bg=colour24'
set -g window-status-bell-style     'fg=black,bg=red,bold,blink'


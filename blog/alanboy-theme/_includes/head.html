  }
  .site-search .ui.icon.input > input::placeholder {

    font-size: 0.85rem;
  }
  .site-search .ui.icon.input > i.icon {
    color: #bbb;
    opacity: 1;
  }
  .site-search .results {
    text-align: left;
  }
